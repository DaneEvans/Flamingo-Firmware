name: Autobuild Flamingo Targets

on:
  push:
    branches: [autobuilds*]
    tags: [flamingo*]
  workflow_dispatch:

concurrency:
  group: build-autobuilds-targets-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Get release version string
        run: |
          echo "long=$(./bin/buildinfo.py long)" >> $GITHUB_OUTPUT
          echo "deb=$(./bin/buildinfo.py deb)" >> $GITHUB_OUTPUT
        id: version
        env:
          BUILD_LOCATION: local
    outputs:
      long: ${{ steps.version.outputs.long }}
      deb: ${{ steps.version.outputs.deb }}

  build:
    name: build-${{ matrix.target }}
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        include:
          ## Custom Hardware, meshtastic Firmware compatible
          - target: goneepic_cavenode
            platform: nrf52840
            is_vanilla: true
          ## Flamingo / Cave firmware targets
          # Custom HW
          - target: goneepic_cavenode_flamingo
            platform: nrf52840
          - target: goneepic_cavenode_flamingo_slink
            platform: nrf52840
          # Common
          - target: rak_wismeshtag_flamingo
            platform: nrf52840
          - target: tracker-t1000-e_flamingo
            platform: nrf52840
          # Australian
          - target: r1-neo_flamingo
            platform: nrf52840
          - target: t-echo_flamingo
            platform: nrf52840
          - target: seeed_solar_node_flamingo
            platform: nrf52840
          - target: seeed_xiao_nrf52840_sense_flamingo
            platform: nrf52840
          - target: heltec-v3_flamingo
            platform: esp32s3
          # - target: seeed_xiao_nrf52840_kit_flamingo
          #   platform: nrf52840

          # US
          - target: t-deck-tft_flamingo
            platform: esp32s3
          # removing these as they don't build successfully - suspect the 'upload' or the 'libdeps.'
          # - target: rak4631_flamingo
          #   platform: nrf52840
          # - target: rak4631_slink
          #   platform: nrf52840
          # - target: rak4631_buzzer
          #   platform: nrf52840
          # - target: rak4631_cavegen2
          #   platform: nrf52840

    uses: ./.github/workflows/build_firmware.yml
    with:
      version: ${{ needs.version.outputs.long }}
      platform: ${{ matrix.platform }}
      pio_env: ${{ matrix.target }}
      is_vanilla: ${{ matrix.is_vanilla == true }}

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [version, build]
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: firmware-*-${{ needs.version.outputs.long }}
          path: ./artifacts
          merge-multiple: false

      - name: Zip each target for release
        run: |
          for d in ./artifacts/firmware-*/; do
            n=$(basename "$d")
            zip -j -r "./${n}.zip" "$d"
          done

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Flamingo ${{ github.ref_name }}
          body: "Autobuild Flamingo firmware ${{ github.ref_name }}"
          files: firmware-*.zip
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
