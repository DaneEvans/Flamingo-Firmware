; The very slick RAK wireless RAK 4631 / 4630 board - Unified firmware for 5005/19003, with or without OLED RAK 1921
[env:rak4631]
custom_meshtastic_hw_model = 9
custom_meshtastic_hw_model_slug = RAK4631
custom_meshtastic_architecture = nrf52840
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = RAK WisBlock 4631
custom_meshtastic_images = rak4631.svg, rak4631_case.svg
custom_meshtastic_tags = RAK

extends = nrf52840_base
board = wiscore_rak4631
board_level = pr
board_check = true
build_type = release
build_flags = ${nrf52840_base.build_flags}
  -I variants/nrf52840/rak4631
  -D RAK_4631
  -DMESHTASTIC_USE_EINK_UI=0
  -DRADIOLIB_EXCLUDE_SX128X=1
  -DRADIOLIB_EXCLUDE_SX127X=1
  -DRADIOLIB_EXCLUDE_LR11X0=1
build_src_filter = ${nrf52_base.build_src_filter} \
  +<../variants/nrf52840/rak4631> \
  +<mesh/eth/> \
  +<mesh/api/> \
  +<mqtt/> \
  -<graphics/EInkDisplay2.cpp> \
  -<graphics/EInkDynamicDisplay.cpp> \
  -<graphics/fonts/EinkDisplayFonts.cpp>
lib_deps = 
  ${nrf52840_base.lib_deps}
  ${networking_base.lib_deps}
  # renovate: datasource=custom.pio depName=Melopero RV3028 packageName=melopero/library/Melopero RV3028
  melopero/Melopero RV3028@1.2.0
  # renovate: datasource=github-tags depName=RAK13800-W5100S packageName=RAKWireless/RAK13800-W5100S
  https://github.com/RAKWireless/RAK13800-W5100S/archive/1.0.2.zip
  # renovate: datasource=custom.pio depName=RAK NCP5623 RGB LED packageName=rakwireless/library/RAKwireless NCP5623 RGB LED library
  rakwireless/RAKwireless NCP5623 RGB LED library@1.0.3
  # renovate: datasource=custom.pio depName=RAK12035_SoilMoisture packageName=beegee-tokyo/library/RAK12035_SoilMoisture
  beegee-tokyo/RAK12035_SoilMoisture@1.0.4
  # renovate: datasource=git-refs depName=RAK12034-BMX160 packageName=https://github.com/RAKWireless/RAK12034-BMX160 gitBranch=main
  https://github.com/RAKWireless/RAK12034-BMX160/archive/dcead07ffa267d3c906e9ca4a1330ab989e957e2.zip

[env:rak4631_flamingo]
extends = env:rak4631
board_level = extra

; upload_protocol = stlink
;upload_protocol = jlink
;debug_tool = jlink

; FLAMINGO_MAX_RXMIT controls number of retransmits for both broadcast packets (flooding router)
; and direct messages (next hop router).
; If 0, then no rexmits for either one.
; If not defined, code reverts to stock firmware behavior.

build_flags =
  ${env:rak4631.build_flags}
  -D FLAMINGO
  -D FLAMINGO_NODEINFO
  -DFLAMINGO_NODEINFO_MAXMINUTES=15    ;nodeinfo in response to 'adni' admin command sent between 0 and MAXMINUTES (actual value randomly chosen)
  -D MESHTASTIC_EXCLUDE_MQTT
  -DUSERPREFS_SPLASH_TITLE=\"FLAMINGO.8.26\"
  -DFLAMINGO_MAX_REXMIT=2
;-D FLAMINGO_SLINK_DEBUG
;-D MESHTASTIC_EXCLUDE_GPS
;-D LORA_DISABLE_SENDING
;-D LORA_DISABLE_RECEIVE


; lib_deps =
;   ${env:rak4631.lib_deps}
;   https://github.com/geeksville/Armduino-Semihosting.git#35b538fdf208c3530c1434cd099a08e486672ee4

[env:rak4631_slink]
extends = env:rak4631_flamingo
board_level = extra

; upload_protocol = stlink
;upload_protocol = jlink
;debug_tool = jlink

build_flags =
  ${env:rak4631_flamingo.build_flags}
  -D FLAMINGO_SLINK
  -DFLAMINGO_SLINK_RXD=15
  -DFLAMINGO_SLINK_TXD=16

lib_deps =
  ${env:rak4631_flamingo.lib_deps}

[env:rak4631_buzzer]
extends = env:rak4631_flamingo
board_level = extra

build_flags =
  ${env:rak4631_flamingo.build_flags}
  -D FLAMINGO_BUZZER
  -D FLAMINGO_BUZZER_LOWTRUE
;  -DFLAMINGO_BUZZER_IO=17
  -DFLAMINGO_BUZZER_IO=21       

; buzzer I/O for WismeshPocket is IO3  (-DFLAMINGO_BUZZER_IO=21)
; 

lib_deps =
 ${env:rak4631_flamingo.lib_deps}



; cave node generation 2
; Has buzzer and blinky LED
; Buzzer is IO2 - 34
; LED is IO1 - 17
[env:rak4631_cavegen2]
extends = env:rak4631_flamingo
board_level = extra

build_flags =
  ${env:rak4631_flamingo.build_flags}
  -D FLAMINGO_BUZZER
  -D FLAMINGO_BUZZER_LOWTRUE
  -D FLAMINGO_BLINKY
  -DFLAMINGO_BLINKY_IO=17
  -DFLAMINGO_BUZZER_IO=34    

lib_deps =
  ${env:rak4631_flamingo.lib_deps}

; Slink with buzzer and blinky LED
; This known in docs as HybidV3 (hybrid since it has RS485)
; The IC2 port is repurposed to general IO
; as these pins are available on the RS485 module connector (RAK5802)
; A high true buzzer cannot be on an I2C pin as it is normally high during
; bootup, causing the buzzer to sound before it can change to GPIO
; Buzzer is P0.31 - AIN1
; LED is P0.14 - I2C1_SCL
[env:rak4631_slinkbuzzer]
extends = env:rak4631_flamingo
board_level = extra

build_flags =
  ${env:rak4631_slink.build_flags}
  -D FLAMINGO_BUZZER
  -D FLAMINGO_BLINKY
  -DMESHTASTIC_EXCLUDE_I2C=1
  -DFLAMINGO_BLINKY_IO=14
  -DFLAMINGO_BUZZER_IO=31
  -D MESHTASTIC_EXCLUDE_SCREEN
  -DMESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR=1
  -DMESHTASTIC_EXCLUDE_INPUTBROKER=1


lib_deps =
  ${env:rak4631_flamingo.lib_deps}


; cave node generation 2 with hop_debug
; Forces nodes to accept only neighbor packets
; based on node name

[env:rak4631_cavegen2_hopdebug]
extends = env:rak4631_cavegen2
board_level = extra

build_flags =
  ${env:rak4631_cavegen2.build_flags}
  -D FLAMINGO_HOP_DEBUG
  -DFLAMINGO_REJECT_PERCENTAGE=50
  

lib_deps =
  ${env:rak4631_cavegen2.lib_deps}
  

[env:rak4631_flamingo_hopdebug]
extends = env:rak4631_flamingo
board_level = extra

build_flags =
  ${env:rak4631_cavegen2.build_flags}
  -D FLAMINGO_HOP_DEBUG
  -DFLAMINGO_REJECT_PERCENTAGE=0
  -DUSERPREFS_SPLASH_TITLE=\"FLAMINGO.TST\"


lib_deps =
  ${env:rak4631_cavegen2.lib_deps}
