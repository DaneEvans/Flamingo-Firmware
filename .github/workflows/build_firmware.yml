name: Build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      platform:
        required: true
        type: string
      pio_env:
        required: true
        type: string
      is_vanilla:
        required: false
        type: boolean
        default: false

permissions: read-all

jobs:
  pio-build:
    name: build-${{ inputs.platform }}
    # Use 'arctastic' self-hosted runner pool when building in the main repo
    runs-on: ${{ github.repository_owner == 'meshtastic' && 'arctastic' || 'ubuntu-latest' }}
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: ${{github.event.pull_request.head.ref}}
          repository: ${{github.event.pull_request.head.repo.full_name}}

      - name: Set OTA firmware source and target
        if: startsWith(inputs.platform, 'esp32')
        id: ota_dir
        env:
          PIO_PLATFORM: ${{ inputs.platform }}
        run: |
          if [ "$PIO_PLATFORM" = "esp32s3" ]; then
            echo "src=firmware-s3.bin" >> $GITHUB_OUTPUT
            echo "tgt=release/bleota-s3.bin" >> $GITHUB_OUTPUT
          elif [ "$PIO_PLATFORM" = "esp32c3" ] || [ "$PIO_PLATFORM" = "esp32c6" ]; then
            echo "src=firmware-c3.bin" >> $GITHUB_OUTPUT
            echo "tgt=release/bleota-c3.bin" >> $GITHUB_OUTPUT
          elif [ "$PIO_PLATFORM" = "esp32" ]; then
            echo "src=firmware.bin" >> $GITHUB_OUTPUT
            echo "tgt=release/bleota.bin" >> $GITHUB_OUTPUT
          fi

      # Build as vanilla when requested by caller.
      - name: Set firmware edition to VANILLA
        id: vanilla_prefs
        if: ${{ inputs.is_vanilla }}
        env:
          PIO_ENV: ${{ inputs.pio_env }}
        run: |
          echo "[vanilla] pio_env=$PIO_ENV"
          echo "[vanilla] workspace=$(pwd)"
          echo "[vanilla] before change:"
          grep -n 'USERPREFS_FIRMWARE_EDITION' userPrefs.jsonc || true

          python3 - <<'PY'
import pathlib
import re

path = pathlib.Path("userPrefs.jsonc")
text = path.read_text(encoding="utf-8")
replacement = '  "USERPREFS_FIRMWARE_EDITION": "meshtastic_FirmwareEdition_VANILLA",'
pattern = re.compile(r'^\s*(?://\s*)?"USERPREFS_FIRMWARE_EDITION"\s*:\s*"[^"]*"\s*,\s*$', re.MULTILINE)
new_text, count = pattern.subn(replacement, text, count=1)
if count == 0:
    raise SystemExit("USERPREFS_FIRMWARE_EDITION not found in userPrefs.jsonc")
path.write_text(new_text, encoding="utf-8")
print("Updated USERPREFS_FIRMWARE_EDITION to VANILLA")
PY

          echo "[vanilla] after change:"
          grep -n 'USERPREFS_FIRMWARE_EDITION' userPrefs.jsonc || true
          sha256sum userPrefs.jsonc

      - name: Verify vanilla prefs before build
        if: ${{ inputs.is_vanilla }}
        env:
          PIO_ENV: ${{ inputs.pio_env }}
        run: |
          echo "[vanilla] verifying before build for pio_env=$PIO_ENV"
          echo "[vanilla] workspace=$(pwd)"
          grep -n 'USERPREFS_FIRMWARE_EDITION' userPrefs.jsonc || true
          sha256sum userPrefs.jsonc

      - name: Build ${{ inputs.platform }}
        id: build
        uses: meshtastic/gh-action-firmware@main
        with:
          pio_platform: ${{ inputs.platform }}
          pio_env: ${{ inputs.pio_env }}
          pio_target: build
          ota_firmware_source: ${{ steps.ota_dir.outputs.src || '' }}
          ota_firmware_target: ${{ steps.ota_dir.outputs.tgt || '' }}

      - name: Job summary
        env:
          PIO_ENV: ${{ inputs.pio_env }}
        run: |
          echo "## $PIO_ENV" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary><strong>Manifest</strong></summary>" >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat release/firmware-*.mt.json >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      - name: Store binaries as an artifact
        uses: actions/upload-artifact@v6
        id: upload
        with:
          name: firmware-${{ inputs.platform }}-${{ inputs.pio_env }}-${{ inputs.version }}
          overwrite: true
          path: |
            release/*.mt.json
            release/*.bin
            release/*.elf
            release/*.uf2
            release/*.hex
            release/*.zip
            release/device-*.sh
            release/device-*.bat
